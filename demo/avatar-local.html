  <script>
    async function handleImageError(e) {
      const img = e.target; // The image element that raised this error event
      let response = await fetch(img.src);
      if (response && response.status === 410) {
        img.alt = 'name expired';
      } else if (response && response.status == 429) {
        img.alt = 'we hit the rate limiter, try reloading';
      } else {
        console.log(e, response.status);
        // Some other error occurred, handle it as you wish or leave the alt attribute empty
        // console.error('An unknown error has occurred while loading image:', e);
        img.alt = 'load takes time, try reloading';
      }
    }
  </script>
