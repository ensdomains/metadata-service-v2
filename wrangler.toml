name = "ens-metadata-v2"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]
find_additional_modules = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# WASM rules — esbuild emits .wasm imports as files, wrangler loads them as compiled modules
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.br"]
fallthrough = true

# NOTE: `yarn deploy` runs `wrangler deploy` with NO --env, so the DEFAULT
# (top-level) worker below IS production. Named environments are intentionally
# omitted: wrangler does not inherit top-level bindings into `[env.*]`, so a
# `--env production` deploy would ship a worker with no KV/R2/D1. Configure
# production via the top-level [vars] + bindings here.

# KV Namespaces for caching
[[kv_namespaces]]
binding = "METADATA_CACHE"
id = "27a721dd79c94871a8f1e74a5e6d8716"
preview_id = "metadata_cache_preview"

[[kv_namespaces]]
binding = "SVG_CACHE"
id = "9975509b9e614e6cabccd1f9b23553eb"
preview_id = "svg_cache_preview"

# R2 Buckets for asset storage
[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "ens-metadata-assets"
preview_bucket_name = "ens-metadata-assets-preview"

# D1 Database for analytics and state
[[d1_databases]]
binding = "DB"
database_name = "ens-metadata-db"
database_id = "5b6e560b-4ecf-4e8a-962e-b7d67181c01c"
preview_database_id = "ens-metadata-database-preview-id"


# Environment variables
[vars]
ENSNODE_MAINNET_URL = "https://api.mainnet.ensnode.io/subgraph"
ENSNODE_SEPOLIA_V2_URL = "https://graphql.ens.dev"
ENSNODE_SEPOLIA_V1_URL = "https://api.sepolia.ensnode.io/subgraph"
MAINNET_FALLBACK_RPC_1 = "https://rpc.ankr.com/eth"
MAINNET_FALLBACK_RPC_2 = "https://cloudflare-eth.com"
MAINNET_FALLBACK_RPC_3 = "https://eth.drpc.org"
SEPOLIA_FALLBACK_RPC_1 = "https://rpc.ankr.com/eth_sepolia"
# Sepolia is where ALL v2/migration on-chain checks run today — keep two fallbacks
# (defaultFallbackRpcs is empty for sepolia in config/networks.ts).
SEPOLIA_FALLBACK_RPC_2 = "https://sepolia.drpc.org"
LOG_LEVEL = "info"
MAX_AVATAR_BYTES = "26214400"  # 25 MB cap on fetched avatar size (DoS guard)
# Secrets (set via `wrangler secret put`, never in plaintext here):
#   WEBHOOK_SECRET   — required in production (webhook is fail-closed without it)
#   MAINNET_RPC_URL, SEPOLIA_RPC_URL — primary RPC endpoints (required)
