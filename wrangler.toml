name = "ens-metadata-v2"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]
find_additional_modules = true

# WASM rules — esbuild emits .wasm imports as files, wrangler loads them as compiled modules
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.br"]
fallthrough = true

[env.development]
name = "ens-metadata-v2-dev"

[env.production]
name = "ens-metadata-v2-prod"

# KV Namespaces for caching
[[kv_namespaces]]
binding = "METADATA_CACHE"
id = "2766ef05a18648ae96551372060819d6"
preview_id = "metadata_cache_preview"

[[kv_namespaces]]
binding = "SVG_CACHE"
id = "0f88a76b2acc408080253f51efa0333f"
preview_id = "svg_cache_preview"

# R2 Buckets for asset storage
[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "ens-metadata-assets"
preview_bucket_name = "ens-metadata-assets-preview"

# D1 Database for analytics and state
[[d1_databases]]
binding = "DB"
database_name = "ens-metadata-db"
database_id = "bbce03ba-0fe5-49f6-bd66-2442d77dc345"
preview_database_id = "ens-metadata-database-preview-id"


# Environment variables
[vars]
ENSNODE_MAINNET_URL = "https://api.mainnet.ensnode.io/subgraph"
ENSNODE_SEPOLIA_URL = "https://api.sepolia.ensnode.io/subgraph"
MAINNET_RPC_URL = "https://eth.llamarpc.com"
SEPOLIA_RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com"
MAINNET_FALLBACK_RPC_1 = "https://rpc.ankr.com/eth"
MAINNET_FALLBACK_RPC_2 = "https://cloudflare-eth.com"
MAINNET_FALLBACK_RPC_3 = "https://eth.drpc.org"
SEPOLIA_FALLBACK_RPC_1 = "https://rpc.ankr.com/eth_sepolia"
LOG_LEVEL = "info"
# WEBHOOK_SECRET — set via `wrangler secret put WEBHOOK_SECRET` (not in plaintext here)

# Production-specific environment variables
[env.production.vars]
ENSNODE_MAINNET_URL = "https://api.mainnet.ensnode.io/subgraph"
ENSNODE_SEPOLIA_URL = "https://api.sepolia.ensnode.io/subgraph"
MAINNET_RPC_URL = "https://eth.llamarpc.com"
LOG_LEVEL = "warn"
