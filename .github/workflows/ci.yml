name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = maintenance LTS, 24 = active LTS (node 20 went EOL 2026-04).
        # Both ship node:sqlite, which the D1 regression suites rely on
        # (test/webhook-warming.test.ts skips them gracefully where absent).
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      # @vitest/coverage-v8 must stay on vitest's exact version (it is a peer
      # dependency), or `--coverage` crashes.
      - name: Run tests with coverage
        run: pnpm vitest run --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (bundle dry-run)
    runs-on: ubuntu-latest
    env:
      # No Cloudflare auth needed: `deploy --dry-run` only bundles, never uploads.
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Type-check and bundle the Worker (no deploy)
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Fails on high/critical advisories in runtime `dependencies`, the only
      # packages that can end up in the Worker bundle; devDependencies (vitest,
      # eslint, wrangler) run only in CI and on developer machines. Accepted
      # exceptions, each with its reason, are auditConfig.ignoreGhsas in
      # pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from that release's
      # gitleaks_8.30.1_checksums.txt. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history: a secret committed and deleted later is still
          # published.
          fetch-depth: 0
      # The gitleaks CLI (MIT) rather than gitleaks-action, which requires a
      # GITLEAKS_LICENSE secret for organization-owned repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # Every commit reachable from the checked-out ref (the PR merge commit or
      # the pushed commit), not other branches. Rules and the test-fixture
      # allowlist are in .gitleaks.toml; --redact keeps matched values out of
      # the public job log.
      - name: Scan git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts=HEAD
          --redact --verbose --no-banner .
