name: Release

# Prod releases are rolling date tags on a main commit: YYYY-MM-DD (UTC) for
# the day's first release, YYYY-MM-DD.2, .3, ... for later ones. No other tag
# (e.g. v1.2.3) triggers a deploy. Stage is not deployed from here: Workers
# Builds deploys every push to main to ens-metadata-stage.
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].*"

# One prod deploy at a time, in tag order; never cancel one mid-way.
concurrency:
  group: prod-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    # Required reviewers and the prod-scoped Cloudflare token live on this
    # GitHub environment, not in repo secrets.
    environment: prod
    # To create the GitHub release for the tag.
    permissions:
      contents: write
    env:
      WRANGLER_SEND_METRICS: "false"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history and tags, to check the tagged commit is on main and
          # to find the previous release for the notes.
          fetch-depth: 0

      - name: Check the tag format
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(\.([2-9]|[1-9][0-9]+))?$ ]]; then
            echo "::error::Tag '$TAG' is not YYYY-MM-DD or YYYY-MM-DD.COUNT (COUNT >= 2)."
            exit 1
          fi

      - name: Check the tagged commit is on main
        id: branch
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main. Only main reaches prod."
            exit 1
          fi

      - uses: ./.github/actions/setup
        id: setup

      - name: Lint, typecheck and test
        id: checks
        run: pnpm lint && pnpm typecheck && pnpm vitest run

      # The changes since the previous release tag: the full list for the
      # GitHub release, and the same list cut to 1000 bytes (Cloudflare's limit)
      # for the Worker version message.
      - name: Write the release notes
        id: notes
        run: |
          node scripts/release-notes.mjs "$TAG" "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      # Migrations are additive, so the version still serving traffic keeps
      # working against the new schema until the deploy below lands.
      - name: Apply D1 migrations
        id: migrate
        run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        id: deploy
        run: pnpm run deploy --tag "$TAG" --message "$(cat "$RUNNER_TEMP/release-message.txt")"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Only after a successful deploy, so a release on GitHub means it is live.
      # A re-run of the workflow updates the existing release instead.
      - name: Create the GitHub release
        id: release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # Posts the outcome to Slack, failures included; a rerun posts again.
      # A failed post must not mark a finished release as failed.
      - name: Post to Slack
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          STEPS: ${{ toJSON(steps) }}
          SLACK_WEBHOOK_URL: ${{ secrets.RELEASES_SLACK_WEBHOOK }}
        run: node scripts/release-slack.mjs "$RUNNER_TEMP"
