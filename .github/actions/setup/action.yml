name: Setup
description: Set up Node.js + Yarn (berry) with a warm cache and an immutable install.

inputs:
  node-version:
    description: Node.js version to install.
    default: "20"

runs:
  using: composite
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Yarn 4 (berry) is driven by Corepack per the `packageManager` field in
    # package.json — no global yarn install needed.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Locate Yarn cache
      id: yarn-cache
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - name: Restore Yarn cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.yarn-cache.outputs.dir }}
        key: yarn-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-${{ runner.os }}-node${{ inputs.node-version }}-
          yarn-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
