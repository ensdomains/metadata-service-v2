name: Setup
description: Set up Node.js + pnpm with a warm store cache and a frozen-lockfile install.

inputs:
  node-version:
    description: Node.js version to install.
    default: "20"

runs:
  using: composite
  steps:
    # The pnpm version is read from the `packageManager` field in package.json.
    # Must run before setup-node so its pnpm store cache can be located.
    # Third-party action, so pinned by commit (the one `v4` resolved to).
    - name: Set up pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
